[project]
name = "reserchia"
version = "0.1.0"
description = "A LangGraph agent running on DeepSeek V4 Flash"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "python-dotenv>=1.2.2",
]

[project.scripts]
reserchia = "reserchia.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
