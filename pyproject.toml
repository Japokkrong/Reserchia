[project]
name = "reserchia"
version = "0.1.0"
description = "A LangGraph agent running on DeepSeek V4 Flash"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
]

[project.scripts]
reserchia = "reserchia.cli:main"
reserchia-ui = "reserchia.ui_runner:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
eda = [
    "chromadb>=1.5.9",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "rank-bm25>=0.2.2",
    "tokenizers>=0.23.1",
]
ui = [
    "chainlit>=2.11.1",
]
